# Hooks de git. Se instalan de forma explícita con: npx lefthook install
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,json,css}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    stylelint:
      glob: "src/**/*.css"
      run: npx stylelint {staged_files}

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
